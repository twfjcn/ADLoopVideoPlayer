name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup JDK17 for sdkmanager
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK cmdline-tools + android-25
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip
          unzip -q commandlinetools-linux-6858069_latest.zip
          mv cmdline-tools latest
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          # 重点：--no_https 绕过ssl问题，补齐老依赖
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --no_https --verbose \
            "platform-tools" \
            "platforms;android-25" \
            "build-tools;25.0.3" \
            "extra;android;m2repository"
          # 校验是否真的装上android-25
          ls -la $ANDROID_HOME/platforms
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk

      - name: Setup JDK8 for Gradle 2.10
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADLoopVideoPlayer-debug
          path: app/build/outputs/apk/debug/*.apk
